[project]
name = "slop-discord-wiki-sync"
version = "1.2.0"
description = "Publish Obsidian vault notes as Discord forum threads and keep them in sync by editing messages only."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-VibeCoded-AI-Slop-1.0"
license-files = ["LICENSE"]
keywords = ["discord", "obsidian", "forum", "sync", "markdown", "wiki"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["pyyaml>=6.0"]

# This repo is a script, not an installable package: `uv run sync.py ...` uses the
# project environment without building/installing anything.
[tool.uv]
package = false
